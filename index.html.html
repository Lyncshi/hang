<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Виселица: магазины</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #1a2a32 0%, #2c3e50 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    -webkit-user-select: none;
    user-select: none;
}
.game {
    width: 100%;
    max-width: 500px;
    background: #fffbf5;
    border-radius: 24px;
    padding: 20px 18px 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f1c40f;
}
.title {
    font-size: 1.15rem;
    font-weight: bold;
    color: #1e3a3f;
}
.hint {
    font-size: 0.78rem;
    color: #7a8f8f;
    font-style: italic;
}
.lives {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 8px;
    letter-spacing: 3px;
    min-height: 30px;
}
.lives .heart { margin: 0 1px; }
.word {
    text-align: center;
    font-size: 1.9rem;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    letter-spacing: 6px;
    color: #1e3a3f;
    background: #f7f3eb;
    padding: 18px 12px;
    border-radius: 16px;
    margin-bottom: 14px;
    word-break: break-all;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.letters {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}
.letter {
    background: #f0f7fa;
    border: 2px solid #dbaa7a;
    padding: 12px 0;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #2c3e50;
    cursor: pointer;
    text-align: center;
    transition: 0.1s;
    -webkit-tap-highlight-color: transparent;
}
.letter:active { transform: scale(0.93); }
.letter.used { opacity: 0.3; pointer-events: none; }
.letter.correct { background: #7bc07b; color: white; border-color: #2b7a2b; }
.letter.wrong { background: #e07a7a; color: white; border-color: #b33a3a; }
.status {
    text-align: center;
    font-size: 0.95rem;
    font-weight: bold;
    padding: 10px;
    border-radius: 14px;
    background: #f0ebe3;
    color: #4a6a6b;
    margin-bottom: 10px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
}
.status.win { background: #d4edda; color: #155724; }
.status.lose { background: #f8d7da; color: #721c24; }
.new-btn {
    width: 100%;
    background: linear-gradient(135deg, #e67e22, #d35400);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 16px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
.new-btn:active { transform: scale(0.98); background: #b85c00; }
@media (max-width: 360px) {
    .word { font-size: 1.5rem; letter-spacing: 4px; }
    .letter { padding: 10px 0; font-size: 0.95rem; }
    .title { font-size: 1rem; }
}
</style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="title">🎯 Виселица</div>
        <div class="hint">магазины</div>
    </div>

    <div class="lives" id="lives"></div>
    <div class="word" id="word"></div>
    <div class="letters" id="letters"></div>
    <div class="status" id="status">Нажимай на буквы</div>
    <button class="new-btn" id="newBtn">🔄 Новое слово</button>
</div>

<script>
const WORDS = [
    "BAKERY",       // пекарня
    "CHEMIST",      // аптека
    "BUTCHER",      // мясной
    "FLORIST",      // цветочный
    "JEWELLER",     // ювелирный
    "OPTICIAN",     // оптика
    "FISHMONGER",   // рыбный
    "NEWSAGENT",    // газетный
    "HAIRDRESSER"   // парикмахерская
];

const wordEl = document.getElementById('word');
const lettersEl = document.getElementById('letters');
const livesEl = document.getElementById('lives');
const statusEl = document.getElementById('status');
const newBtn = document.getElementById('newBtn');

let currentWord = '';
let guessed = [];
let wrongCount = 0;
const MAX_LIVES = 6;

function newGame() {
    currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    guessed = [];
    wrongCount = 0;
    statusEl.textContent = 'Нажимай на буквы';
    statusEl.className = 'status';
    render();
}

function render() {
    // Слово
    let display = '';
    for (let i = 0; i < currentWord.length; i++) {
        display += (guessed.includes(currentWord[i]) ? currentWord[i] : '_') + ' ';
    }
    wordEl.textContent = display.trim();

    // Жизни
    let lives = '';
    for (let i = 0; i < MAX_LIVES; i++) {
        lives += '<span class="heart">' + (i < MAX_LIVES - wrongCount ? '❤️' : '🖤') + '</span>';
    }
    livesEl.innerHTML = lives;

    // Буквы
    let html = '';
    for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        let cls = 'letter';
        if (guessed.includes(letter)) {
            cls += currentWord.includes(letter) ? ' correct used' : ' wrong used';
        }
        html += '<div class="' + cls + '" data-letter="' + letter + '">' + letter + '</div>';
    }
    lettersEl.innerHTML = html;

    lettersEl.querySelectorAll('.letter').forEach(el => {
        el.addEventListener('click', () => guessLetter(el.dataset.letter));
    });

    checkEnd();
}

function guessLetter(letter) {
    if (guessed.includes(letter)) return;
    guessed.push(letter);
    if (!currentWord.includes(letter)) wrongCount++;
    render();
}

function checkEnd() {
    let allFound = true;
    for (let i = 0; i < currentWord.length; i++) {
        if (!guessed.includes(currentWord[i])) { allFound = false; break; }
    }
    if (allFound) {
        statusEl.textContent = '🎉 Победа! Это: ' + currentWord;
        statusEl.className = 'status win';
        lettersEl.querySelectorAll('.letter').forEach(el => el.classList.add('used'));
    } else if (wrongCount >= MAX_LIVES) {
        statusEl.textContent = '💀 Проиграл! Слово: ' + currentWord;
        statusEl.className = 'status lose';
        lettersEl.querySelectorAll('.letter').forEach(el => el.classList.add('used'));
    }
}

newBtn.addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
